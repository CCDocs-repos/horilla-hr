<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f5f7; color: #1d2330; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 20px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label, .label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], input[type=date], input[type=time], select, textarea {
    width: 100%; padding: 10px; font-size: 16px; border: 1px solid #b8bfcc; border-radius: 6px; background: #fff;
  }
  textarea { resize: vertical; }
  .choices label { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 6px 0; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin-top: 16px; }
  .hint { color: #5b6475; font-size: .9rem; margin: 4px 0 0; }
  .error { color: #b3261e; font-size: .95rem; margin: 4px 0 0; }
  .errors-top { background: #fdecea; color: #b3261e; padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; }
  button { margin-top: 20px; width: 100%; padding: 12px; font-size: 1rem; font-weight: 600; color: #fff; background: #1f5eff; border: 0; border-radius: 6px; cursor: pointer; }
  .hp { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
  a { color: #1f5eff; }
</style>
